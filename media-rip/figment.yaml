udev_devices:
  - subsystem: block
    attrs:
      vendor: "{{ $INPUT.optical_vendor }}"
    symlink: "{{ $INPUT.block_device_symlink }}"
  - subsystem: scsi_generic
    attrs:
      vendor: "{{ $INPUT.optical_vendor }}"
    symlink: "{{ $INPUT.scsi_generic_device_symlink }}"

directories:
  - path: "{{ $INPUT.root_directory }}"
    volume:
      name: "{{ $INPUT.config_volume_name }}"
  - path: "{{ $INPUT.output_directory }}"
    volume:
      name: "{{ $INPUT.output_volume_name }}"

docker:
  services:
    - name: "{{ $INPUT.service_name }}"
      dockerfile: media-rip/templates/Dockerfile
      ports:
        - "{{ $INPUT.web_port }}:5800"
      environment:
        - KEEP_APP_RUNNING={{ $INPUT.keep_app_running }}
        - AUTO_DISC_RIPPER=1
      volumes:
        - "{{ $INPUT.output_volume }}:/output"
        - "{{ $INPUT.config_volume }}:/config"

provides:
  output_volume: "{{ $INPUT.output_volume_name }}"